<script>
let answers = {};
let step = 0;
const MASCOTS = ["🐰","🤍","💜","🐶","🐱","🎀","⭐","🌈"];

// ── 캐릭터 데이터 로드 (한 번만 받아서 캐시) ──────────────
let CHARACTERS = null;
async function loadCharacters() {
  if (CHARACTERS) return CHARACTERS;
  const data = await (await fetch("characters.json")).json();
  CHARACTERS = data.characters;
  return CHARACTERS;
}

// ── 룰베이스 추천 점수 (서버 로직을 브라우저로 이식) ──────
const SYNONYMS = {
  "멋진":   ["스타일리시", "시크한", "멋진", "인기많은"],
  "강한":   ["강력한", "강한", "힘센", "액션", "배틀", "슈팅", "보스"],
  "무서운": ["무서운", "호러", "몬스터", "스릴", "퇴마사"],
  "웃긴":   ["웃긴", "엉뚱한", "장난꾸러기", "유머러스", "밈"],
  "똑똑한": ["똑똑한", "발명", "진지한", "리더십"],
  "신비한": ["신비한", "마법", "전설", "변신"],
  "활발한": ["활발한", "에너지", "빠른"],
  "귀여운": ["귀여운", "사랑", "사랑스러운", "다정한", "착한", "순수한"],
  "모험":   ["모험", "탐험", "생존", "배틀"],
  "변신":   ["변신", "로봇", "마법"],
  "수집":   ["수집", "진화"],
  "만들기": ["만들기", "건축", "발명"],
  "춤추기": ["춤추기", "음악", "노래"],
  "하양":   ["하양", "하얀색"],
};

function matchKeyword(c, value, cap) {
  if (!value || value === "any") return 0;
  let s = 0;
  if (c.keywords.includes(value)) s += 3;
  (SYNONYMS[value] || []).forEach((k) => {
    if (c.keywords.includes(k)) s += 1;
  });
  return Math.min(s, cap);
}

const KEYWORD_DIMS = [
  { key: "mood", cap: 4 },
  { key: "color", cap: 3 },
  { key: "activity", cap: 4 },
  { key: "animal", cap: 4 },
  { key: "personality", cap: 4 },
];

function scoreCharacter(c, a) {
  const parts = {};
  if (a.gender) {
    if (c.target_gender === a.gender) parts.gender = 6;
    else if (c.target_gender === "공통") parts.gender = 2;
    else parts.gender = -5;
  }
  if (a.type && a.type !== "any") {
    const inCat = c.category.includes(a.type);
    const inSub = (c.sub_category || "").includes(a.type);
    if (inCat || inSub) parts.type = 6 + (inSub ? 2 : 0);
    else parts.type = -1;
  }
  if (c.target_age === "고학년") parts.age = -2;
  if (a.who === "hana" || a.who === "haesung") {
    if (["유치원", "저학년", "전학년"].includes(c.target_age)) parts.who = 1;
  }
  for (const { key, cap } of KEYWORD_DIMS) {
    const v = matchKeyword(c, a[key], cap);
    if (v) parts[key] = v;
  }
  const total = Object.values(parts).reduce((sum, v) => sum + v, 0);
  return { total, parts };
}

function pickRunners(ranked, top, count) {
  const runners = [];
  const usedSubs = new Set([top.sub_category]);
  for (const c of ranked) {
    if (runners.length >= count) break;
    if (c.id === top.id) continue;
    if (usedSubs.has(c.sub_category)) continue;
    runners.push(c);
    usedSubs.add(c.sub_category);
  }
  for (const c of ranked) {
    if (runners.length >= count) break;
    if (c.id === top.id || runners.includes(c)) continue;
    runners.push(c);
  }
  return runners;
}

// 추천 계산: answers → { top, runners } (서버 /api/recommend 대체)
async function recommend(a) {
  const ranked = (await loadCharacters())
    .map((c) => {
      const { total, parts } = scoreCharacter(c, a);
      return { ...c, score: total, score_parts: parts };
    })
    .sort((x, y) => y.score - x.score);
  const top = ranked[0];
  return { top, runners: pickRunners(ranked, top, 2) };
}

function say(t){ document.getElementById("speech").textContent = t; }
function setMascot(i){ document.getElementById("mascot").textContent = MASCOTS[i % MASCOTS.length]; }

// 선택한 아이(해나/해성)면 사진을 마스코트로, 아니면 이모지
function showMascot(){
  const m = document.getElementById("mascot");
  if (answers.who === "hana")
    m.innerHTML = `<img class="mascot-photo" src="/img/hn.jpg" alt="이해나" onerror="this.parentNode.textContent='👧'">`;
  else if (answers.who === "haesung")
    m.innerHTML = `<img class="mascot-photo" src="/img/hs.jpg" alt="이해성" onerror="this.parentNode.textContent='👦'">`;
  else
    m.textContent = MASCOTS[step % MASCOTS.length];
}

// 인트로: 너는 누구야?
function renderIntro() {
  setMascot(5); // 🎀
  toggleEgg(true);
  say("안녕! 너는 누구야? 알려줘 💕");
  let html = `<div class="question">너는 누구야? 🌟</div><div class="options">`;
  WHO_OPTIONS.forEach((o,i)=>{
    const visual = o.img
      ? `<img class="opt-photo" src="${o.img}" alt="${o.label}"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'emoji',textContent:'${o.emoji}'}))">`
      : `<span class="emoji">${o.emoji}</span>`;
    html += `<button class="opt c${(i%4)+1}" onclick="chooseWho('${o.value}')">
      ${visual}${o.label}</button>`;
  });
  html += `</div>`;
  document.getElementById("app").innerHTML = html;
}

function chooseWho(value){
  toggleEgg(false);
  answers = { who: value };
  step = 0;
  render();
}

// 🥚 이스터에그: 알에서 이브이 부화시키기
function toggleEgg(show){
  const e = document.getElementById("egg");
  if (e) e.style.display = show ? "block" : "none";
}

async function showEevee(){
  toggleEgg(false);
  answers = { who: "egg" };
  showMascot();
  say("어라...? 알이 움찔움찔! 🥚✨");
  document.getElementById("app").innerHTML = `<div style="font-size:4rem;">🥚</div><div style="color:#b48;">두근두근...</div>`;
  try {
    const all = await loadCharacters();
    const top = all.find(c => c.name === "이브이") || all[0];
    const pool = all.filter(c => c.id !== top.id);
    const runners = [];
    while (runners.length < 2 && pool.length) {
      runners.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    say("짜잔! 이브이를 만들었어! 🦊✨");
    document.getElementById("app").innerHTML = `
      <img class="result-img" src="${top.image}" alt="${top.name}"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'${top.emoji||"🦊"}',style:'font-size:6rem'}))">
      <div class="result-sub">🥚 비밀의 알에서 태어난 친구!</div>
      <div class="result-name">${top.name}</div>
      <div class="result-tags">${top.keywords.map(k=>`<span class="tag">#${k}</span>`).join("")}</div>
      <div class="runners">
        <h3>이브이는 여러 모습으로 진화해요 💕</h3>
        <div class="runner-row">
          ${runners.map(r=>`<div class="runner"><img src="${r.image}" alt="${r.name}">${r.name}</div>`).join("")}
        </div>
      </div>
      <div class="closing">
        넌 이 캐릭터(<b>${top.name}</b>)를 좋아하는구나! 💕<br>
        앞으로 <b>해나·해성</b>이랑 캐릭터 놀이하면서 친하게 지내자~<br>
        와줘서 고마워! 🎀✨
      </div>
      <button class="btn-again" onclick="restart()">🔄 처음으로</button>
    `;
  } catch (e) {
    say("앗, 알이 깨지지 않아 😢");
    document.getElementById("app").innerHTML = `<button class="btn-again" onclick="restart()">🔄 다시</button>`;
  }
}

function render() {
  const app = document.getElementById("app");
  if (step >= QUESTIONS.length) { showResult(); return; }
  const q = QUESTIONS[step];
  showMascot();
  // 첫 질문에서는 누구인지에 맞춰 인사
  say(step === 0 && answers.who ? `${GREET[answers.who]}` : q.talk);
  let html = `<div class="progress-dots">`;
  for (let i=0;i<QUESTIONS.length;i++){
    const cls = i===step ? "on" : (i<step ? "done" : "");
    html += `<div class="dot ${cls}"></div>`;
  }
  html += `</div><div class="question">${q.text}</div><div class="options">`;
  q.options.forEach((o,i)=>{
    html += `<button class="opt c${(i%4)+1}" onclick="choose('${q.key}','${o.value}')">
      <span class="emoji">${o.emoji}</span>${o.label}</button>`;
  });
  html += `</div>`;
  html += `<button class="back-btn" onclick="back()">← 뒤로</button>`;
  app.innerHTML = html;
}

function choose(key,value){ answers[key]=value; step++; render(); }
function back(){ if(step>0){ step--; render(); } else { renderIntro(); } }

async function showResult(){
  showMascot();
  say("두구두구... 찾고 있어! 🔍");
  document.getElementById("app").innerHTML = `<div style="font-size:4rem;">🎀</div><div style="color:#b48;">잠깐만 기다려줘~</div>`;
  try {
    const { top, runners } = await recommend(answers);
    say("두구두구... 찾았다! 🎉");
    document.getElementById("app").innerHTML = `
      <img class="result-img" src="${top.image}" alt="${top.name}"
           onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'${top.emoji||"⭐"}',style:'font-size:6rem'}))">
      <div class="result-sub">너에게 딱 맞는 친구는...</div>
      <div class="result-name">${top.name}</div>
      <div class="result-tags">${top.keywords.map(k=>`<span class="tag">#${k}</span>`).join("")}</div>
      <div class="runners">
        <h3>이런 친구도 좋아할 거예요 💕</h3>
        <div class="runner-row">
          ${runners.map(r=>`<div class="runner"><img src="${r.image}" alt="${r.name}">${r.name}</div>`).join("")}
        </div>
      </div>
      <div class="closing">
        넌 이 캐릭터(<b>${top.name}</b>)를 좋아하는구나! 💕<br>
        앞으로 <b>해나·해성</b>이랑 캐릭터 놀이하면서 친하게 지내자~<br>
        와줘서 고마워! 🎀✨
      </div>
      <button class="btn-again" onclick="restart()">🔄 다시 찾기</button>
    `;
  } catch (e) {
    say("앗, 문제가 생겼어 😢");
    document.getElementById("app").innerHTML = `<p>캐릭터 정보를 불러오지 못했어요.<br>잠시 후 다시 시도해줘!</p>
      <button class="btn-again" onclick="restart()">🔄 다시 하기</button>`;
  }
}

function restart(){ step=0; answers={}; renderIntro(); }
renderIntro();
</script>
</body>
</html>
