<!DOCTYPE html>

<style>

  /* 👑 엔딩 연출(완주 시 왕이 공주를 구해줘 고마워하는 장면) */

<body>
  <div class="title">🎀 <span class="name">이해나</span> · <span class="name">이해성</span> 캐릭터 찾기 🎀</div>
  <div class="subtitle">우리 해나·해성이를 위한 특별한 캐릭터 찾기 ✨</div>

  <div class="mascot-row">
    <div class="mascot" id="mascot">🐰</div>
    <div class="speech" id="speech">안녕! 7개만 골라주면 너에게 딱 맞는 캐릭터를 찾아줄게 💕</div>
  </div>

  <div class="card" id="app"></div>

  <!-- 보일듯말듯한 비밀의 알 → 이브이 -->
  <div class="egg" id="egg" onclick="showEevee()" title="?">🥚</div>

  <!-- 🎮 모험 게임 오버레이 -->
  <div class="game-overlay" id="gameOverlay" style="display:none">
    <div class="game-stage">
      <canvas id="gameCanvas"></canvas>
      <div class="game-hud" id="gameHud" style="display:none">
        <span class="hud-chip hud-time">⏱ <span id="hudTime">20</span>초</span>
        <span class="hud-chip">🪙 <span id="hudCoins">0</span></span>
        <span class="hud-chip">❤️ <span id="hudHearts">3</span></span>
        <span class="hud-chip">⭐ <span id="hudScore">0</span></span>
      </div>
      <div class="game-screen" id="gameScreen"></div>
    </div>
    <button class="jump-btn" id="jumpBtn" style="display:none">⬆ 점프</button>
  </div>

<script>
let answers = {};
let step = 0;
let lastTop = null; // 마지막으로 추천된 캐릭터(모험 게임 주인공)
const MASCOTS = ["🐰","🤍","💜","🐶","🐱","🎀","⭐","🌈"];

// ── 캐릭터 데이터 로드 (한 번만 받아서 캐시) ──────────────
let CHARACTERS = null;
async function loadCharacters() {
  if (CHARACTERS) return CHARACTERS;
  const data = await (await fetch("characters.json")).json();
  CHARACTERS = data.characters;
  return CHARACTERS;
}

// ── 룰베이스 추천 점수 (서버 로직을 브라우저로 이식) ──────
const SYNONYMS = {
  "멋진":   ["스타일리시", "시크한", "멋진", "인기많은"],
  "강한":   ["강력한", "강한", "힘센", "액션", "배틀", "슈팅", "보스"],
  "무서운": ["무서운", "호러", "몬스터", "스릴", "퇴마사"],
  "웃긴":   ["웃긴", "엉뚱한", "장난꾸러기", "유머러스", "밈"],
  "똑똑한": ["똑똑한", "발명", "진지한", "리더십"],
  "신비한": ["신비한", "마법", "전설", "변신"],
  "활발한": ["활발한", "에너지", "빠른"],
  "귀여운": ["귀여운", "사랑", "사랑스러운", "다정한", "착한", "순수한"],
  "모험":   ["모험", "탐험", "생존", "배틀"],
  "변신":   ["변신", "로봇", "마법"],
  "수집":   ["수집", "진화"],
  "만들기": ["만들기", "건축", "발명"],
  "춤추기": ["춤추기", "음악", "노래"],
  "하양":   ["하양", "하얀색"],
};

function matchKeyword(c, value, cap) {
  if (!value || value === "any") return 0;
  let s = 0;
  if (c.keywords.includes(value)) s += 3;
  (SYNONYMS[value] || []).forEach((k) => {
    if (c.keywords.includes(k)) s += 1;
  });
  return Math.min(s, cap);
}

const KEYWORD_DIMS = [
  { key: "mood", cap: 4 },
  { key: "color", cap: 3 },
  { key: "activity", cap: 4 },
  { key: "animal", cap: 4 },
  { key: "personality", cap: 4 },
];

function scoreCharacter(c, a) {
  const parts = {};
  if (a.gender) {
    if (c.target_gender === a.gender) parts.gender = 6;
    else if (c.target_gender === "공통") parts.gender = 2;
    else parts.gender = -5;
  }
  if (a.type && a.type !== "any") {
    const inCat = c.category.includes(a.type);
    const inSub = (c.sub_category || "").includes(a.type);
    if (inCat || inSub) parts.type = 6 + (inSub ? 2 : 0);
    else parts.type = -1;
  }
  if (c.target_age === "고학년") parts.age = -2;
  if (a.who === "hana" || a.who === "haesung") {
    if (["유치원", "저학년", "전학년"].includes(c.target_age)) parts.who = 1;
  }
  for (const { key, cap } of KEYWORD_DIMS) {
    const v = matchKeyword(c, a[key], cap);
    if (v) parts[key] = v;
  }
  const total = Object.values(parts).reduce((sum, v) => sum + v, 0);
  return { total, parts };
}

function pickRunners(ranked, top, count) {
  const runners = [];
  const usedSubs = new Set([top.sub_category]);
  for (const c of ranked) {
    if (runners.length >= count) break;
    if (c.id === top.id) continue;
    if (usedSubs.has(c.sub_category)) continue;
    runners.push(c);
    usedSubs.add(c.sub_category);
  }
  for (const c of ranked) {
    if (runners.length >= count) break;
    if (c.id === top.id || runners.includes(c)) continue;
    runners.push(c);
  }
  return runners;
}

// 추천 계산: answers → { top, runners } (서버 /api/recommend 대체)
async function recommend(a) {
  const ranked = (await loadCharacters())
    .map((c) => {
      const { total, parts } = scoreCharacter(c, a);
      return { ...c, score: total, score_parts: parts };
    })
    .sort((x, y) => y.score - x.score);
  const top = ranked[0];
  return { top, runners: pickRunners(ranked, top, 2) };
}

// 첫 페이지: 너는 누구야? (4지선다)

function render() {
  const app = document.getElementById("app");
  if (step >= QUESTIONS.length) { showResult(); return; }
  const q = QUESTIONS[step];
  showMascot();
  // 첫 질문에서는 누구인지에 맞춰 인사
  say(step === 0 && answers.who ? `${GREET[answers.who]}` : q.talk);
  let html = `<div class="progress-dots">`;
  for (let i=0;i<QUESTIONS.length;i++){
    const cls = i===step ? "on" : (i<step ? "done" : "");
    html += `<div class="dot ${cls}"></div>`;
  }
  html += `</div><div class="question">${q.text}</div><div class="options">`;
  q.options.forEach((o,i)=>{
    html += `<button class="opt c${(i%4)+1}" onclick="choose('${q.key}','${o.value}')">
      <span class="emoji">${o.emoji}</span>${o.label}</button>`;
  });
  html += `</div>`;
  html += `<button class="back-btn" onclick="back()">← 뒤로</button>`;
  app.innerHTML = html;
}

function choose(key,value){ answers[key]=value; step++; render(); }
function back(){ if(step>0){ step--; render(); } else { renderIntro(); } }

function startAdventure(){
  if(!lastTop){ return; }
  GAME.heroUrl = lastTop.image || "";
  GAME.heroEmoji = lastTop.emoji || "⭐";
  GAME.heroImg = null; GAME.heroReady = false;
  if(GAME.heroUrl){
    const im = new Image();
    im.onload = ()=>{ GAME.heroReady = true; };
    im.onerror = ()=>{ GAME.heroReady = false; };
    im.src = GAME.heroUrl;
    GAME.heroImg = im;
  }

  GAME.princessImg = null; GAME.princessReady = false;
  const pim = new Image();
  pim.onload = ()=>{ GAME.princessReady = true; };
  pim.onerror = ()=>{ GAME.princessReady = false; };
  pim.src = "/img/hn.jpg";
  GAME.princessImg = pim;

  openOverlay();
  showReadyScreen();
}

// ── 캔버스 크기 설정 ────────────────────────────────────────
function sizeCanvas(){
  const stage = GAME.canvas.parentElement;
  const cssW = stage.clientWidth || 360;
  const vh = window.innerHeight || 600;
  // 점프 버튼 자리를 남기고 화면 세로의 약 62%까지(240~540px)
  const cssH = Math.max(240, Math.min(540, Math.round(vh * 0.62), Math.round(cssW * 0.72)));
  GAME.dpr = window.devicePixelRatio || 1;
  GAME.canvas.style.height = cssH + "px";
  GAME.canvas.width = Math.round(cssW * GAME.dpr);
  GAME.canvas.height = Math.round(cssH * GAME.dpr);
  GAME.ctx.setTransform(GAME.dpr, 0, 0, GAME.dpr, 0, 0);
  GAME.W = cssW; GAME.H = cssH;
  GAME.groundY = cssH - 46;
}

// ── 게임 시작 ───────────────────────────────────────────────
function beginRun(){
  GAME.canvas = $g("gameCanvas");
  GAME.ctx = GAME.canvas.getContext("2d");
  sizeCanvas();

  const size = Math.max(46, Math.min(74, Math.round(GAME.H * 0.2)));
  GAME.player = {
    x: Math.max(54, Math.round(GAME.W * 0.16)),
    size, y: GAME.groundY - size, vy: 0, jumps: 0, onGround: true,
  };
  GAME.obstacles = []; GAME.coins = []; GAME.boosts = []; GAME.pits = []; GAME.pops = []; GAME.sparks = [];
  GAME.spawnObs = 0.8; GAME.spawnCoin = 0.5; GAME.spawnPit = 3.0;
  GAME.bigSchedule = BIG_COIN_TIMES.map(at => ({ at, done: false }));
  GAME.heartSchedule = HEART_TIMES.map(at => ({ at, done: false }));
  GAME.bigObsSchedule = BIG_OBS_TIMES.map(at => ({ at, done: false }));
  GAME.coinCount = 0; GAME.score = 0; GAME.hearts = START_HEARTS; GAME.inv = 0;
  GAME.elapsed = 0; GAME.speed = 250; GAME.submitted = false;
  GAME.phase = "play"; GAME.rescueT = 0;

  $g("gameScreen").classList.add("hidden");
  setHud(true); updateHud();
  showJumpBtn(true);

  bindInput(true);
  GAME.running = true;
  GAME.last = 0;
  GAME.raf = requestAnimationFrame(loop);
}

function stopLoop(){
  GAME.running = false;
  if(GAME.raf) cancelAnimationFrame(GAME.raf);
  GAME.raf = 0;
  bindInput(false);
}

// ── 입력(점프 / 컷신 스킵) ─────────────────────────────────
function showJumpBtn(on){
  const b = $g("jumpBtn");
  if(b) b.style.display = on ? "flex" : "none";
}
function doJump(){
  const p = GAME.player;
  if(!p || !GAME.running || GAME.phase !== "play") return;
  if(p.jumps < MAX_JUMPS){ p.vy = JUMP_V; p.jumps++; p.onGround = false; }
}
function skipRescue(){
  if(GAME.running && GAME.phase === "rescue" && GAME.rescueT > 0.6) goToScore();
}
function onKey(e){
  if(e.code === "Space" || e.code === "ArrowUp" || e.key === " "){
    e.preventDefault();
    if(GAME.phase === "rescue") skipRescue(); else doJump();
  }
}
function onJumpBtn(e){ e.preventDefault(); e.stopPropagation(); doJump(); }
function onCanvasTap(e){ if(GAME.phase === "rescue"){ e.preventDefault(); skipRescue(); } }
function bindInput(on){
  const c = GAME.canvas, b = $g("jumpBtn");
  if(on){
    window.addEventListener("keydown", onKey);
    if(b) b.addEventListener("pointerdown", onJumpBtn);
    if(c) c.addEventListener("pointerdown", onCanvasTap);
  } else {
    window.removeEventListener("keydown", onKey);
    if(b) b.removeEventListener("pointerdown", onJumpBtn);
    if(c) c.removeEventListener("pointerdown", onCanvasTap);
  }
}

// ── 스폰 ────────────────────────────────────────────────────
function spawnObstacle(){
  const h = 28 + Math.floor(Math.random() * 38);   // 28~66
  const w = 22 + Math.floor(Math.random() * 18);
  GAME.obstacles.push({ x: GAME.W + 30, w, h, y: GAME.groundY - h });
}
function spawnCoins(){
  // 작은 코인(1코인): 1개 또는 3개 아치형, 한 번 점프로 닿는 높이
  const cluster = Math.random() < 0.5 ? 3 : 1;
  const baseY = GAME.groundY - (34 + Math.floor(Math.random() * 95));
  for(let i = 0; i < cluster; i++){
    const arc = cluster === 3 ? -Math.sin((i / 2) * Math.PI) * 32 : 0;
    GAME.coins.push({ x: GAME.W + 30 + i * 34, y: baseY + arc, r: 12, taken: false, big: false });
  }
}
function spawnBigCoin(){
  // 큰 코인(10코인): 높이 있어서 더블점프로만 닿음
  const y = Math.max(40, GAME.groundY - 232);
  GAME.coins.push({ x: GAME.W + 40, y, r: 21, taken: false, big: true });
  GAME.pops.push({ x: GAME.W - 60, y: 40, life: 1.4, text: "✨10코인 등장!", color: "#f0a500" });
}
function spawnHeart(){
  // 보너스 하트: 한 번 점프로 닿는 높이
  const y = Math.max(40, GAME.groundY - (96 + Math.floor(Math.random() * 30)));
  GAME.boosts.push({ x: GAME.W + 40, y, r: 17, taken: false });
  GAME.pops.push({ x: GAME.W - 64, y: 60, life: 1.4, text: "❤️ 보너스 하트!", color: "#e74c6f" });
}
function spawnPit(){
  // 바닥 구멍: 점프로 건너뛰어야 함
  const w = 66 + Math.floor(Math.random() * 40);
  GAME.pits.push({ x: GAME.W + 40, w });
}
function spawnBigObstacle(){
  // 큰 선인장: 2단 점프로만 넘을 수 있는 높이(150~180)
  const h = 150 + Math.floor(Math.random() * 30);
  const w = 30 + Math.floor(Math.random() * 10);
  GAME.obstacles.push({ x: GAME.W + 40, w, h, y: GAME.groundY - h, big: true });
  GAME.pops.push({ x: GAME.W - 70, y: 78, life: 1.4, text: "⚠️ 큰 선인장! 2단 점프!", color: "#2e9248" });
}

// ── 메인 루프 ───────────────────────────────────────────────
function loop(t){
  if(!GAME.running) return;
  if(!GAME.last) GAME.last = t;
  let dt = (t - GAME.last) / 1000;
  GAME.last = t;
  if(dt > 0.05) dt = 0.05;        // 탭 전환 후 점프 방지

  if(GAME.phase === "rescue"){
    GAME.rescueT += dt;
    updateRescue(dt);
    renderRescue();
    if(GAME.rescueT >= RESCUE_DUR){ goToScore(); return; }
    GAME.raf = requestAnimationFrame(loop);
    return;
  }

  GAME.elapsed += dt;
  GAME.speed = 250 + Math.min(GAME.elapsed, DUR) / DUR * 175;
  update(dt);
  if(!GAME.running) return;       // 도중 사망 시 endRun 에서 처리됨
  gameRender();
  updateHud();

  if(GAME.elapsed >= DUR){ startRescue(); }
  GAME.raf = requestAnimationFrame(loop);
}

function update(dt){
  const p = GAME.player, g = GAME;
  // 물리
  p.vy += GRAVITY * dt;
  p.y += p.vy * dt;
  const floorTop = g.groundY - p.size;
  const pCenterX = p.x + p.size / 2;
  // 무적 중이 아니고 구멍 위라면 바닥이 없음(빠짐)
  const overPit = g.inv <= 0 && g.pits.some(pt => pCenterX > pt.x + 4 && pCenterX < pt.x + pt.w - 4);
  if(!overPit && p.y >= floorTop){ p.y = floorTop; p.vy = 0; p.jumps = 0; p.onGround = true; }
  else p.onGround = false;
  // 구멍에 빠짐 → 하트 감소 후 복귀
  if(p.y > g.groundY + 26){
    g.hearts--; g.inv = 1.2; p.y = floorTop; p.vy = -360; p.jumps = 0; p.onGround = false;
    g.pops.push({ x: pCenterX, y: floorTop, life: 0.9, text: "구멍! -❤️", color: "#e74c6f" });
    if(g.hearts <= 0){ gameRender(); endRun(false); return; }
  }
  if(g.inv > 0) g.inv -= dt;

  // 스폰 타이머
  g.spawnObs -= dt;
  if(g.spawnObs <= 0){
    spawnObstacle();
    g.spawnObs = Math.max(0.7, 1.45 - g.elapsed * 0.03) + Math.random() * 0.5;
  }
  g.spawnCoin -= dt;
  if(g.spawnCoin <= 0){ spawnCoins(); g.spawnCoin = 0.7 + Math.random() * 0.7; }
  // 큰 코인: 정해진 시각(10초·18초)에 1번씩 등장
  for(const b of g.bigSchedule){
    if(!b.done && g.elapsed >= b.at){ b.done = true; spawnBigCoin(); }
  }
  // 보너스 하트: 정해진 시각(10초·20초)에 1번씩 등장
  for(const b of g.heartSchedule){
    if(!b.done && g.elapsed >= b.at){ b.done = true; spawnHeart(); }
  }
  // 큰 선인장: 정해진 시각에 5개(2단 점프로만 회피)
  for(const b of g.bigObsSchedule){
    if(!b.done && g.elapsed >= b.at){ b.done = true; spawnBigObstacle(); }
  }
  // 바닥 구멍: 일정 간격으로 등장
  g.spawnPit -= dt;
  if(g.spawnPit <= 0){ spawnPit(); g.spawnPit = 2.8 + Math.random() * 2.0; }
  for(const pt of g.pits) pt.x -= g.speed * dt;
  g.pits = g.pits.filter(pt => pt.x + pt.w > -10);

  // 이동 + 충돌
  const pad = p.size * 0.16;
  const pb = { x: p.x + pad, y: p.y + pad, w: p.size - pad * 2, h: p.size - pad * 2 };

  for(const o of g.obstacles){
    o.x -= g.speed * dt;
    if(g.inv <= 0 &&
       pb.x < o.x + o.w && pb.x + pb.w > o.x &&
       pb.y < o.y + o.h && pb.y + pb.h > o.y){
      g.hearts--; g.inv = 1.0; p.vy = -340;
      g.pops.push({ x: p.x + p.size / 2, y: p.y, life: 0.7, text: "-❤️", color: "#e74c6f" });
      if(g.hearts <= 0){ gameRender(); endRun(false); return; }
    }
  }
  g.obstacles = g.obstacles.filter(o => o.x + o.w > -10);

  const pcx = p.x + p.size / 2, pcy = p.y + p.size / 2, pr = p.size * 0.42;
  for(const c of g.coins){
    c.x -= g.speed * dt;
    if(!c.taken){
      const dx = c.x - pcx, dy = c.y - pcy;
      if(dx * dx + dy * dy < (pr + c.r) * (pr + c.r)){
        const val = c.big ? 10 : 1;
        c.taken = true; g.coinCount += val; g.score += val;
        g.pops.push({ x: c.x, y: c.y, life: c.big ? 0.9 : 0.6,
          text: "+" + val, color: c.big ? "#e8870a" : "#f5a201" });
      }
    }
  }
  g.coins = g.coins.filter(c => !c.taken && c.x + c.r > -10);

  // 보너스 하트 획득
  for(const bz of g.boosts){
    bz.x -= g.speed * dt;
    if(!bz.taken){
      const dx = bz.x - pcx, dy = bz.y - pcy;
      if(dx * dx + dy * dy < (pr + bz.r) * (pr + bz.r)){
        bz.taken = true;
        if(g.hearts < MAX_HEARTS) g.hearts++;
        g.pops.push({ x: bz.x, y: bz.y, life: 0.9, text: "+❤️", color: "#e74c6f" });
      }
    }
  }
  g.boosts = g.boosts.filter(bz => !bz.taken && bz.x + bz.r > -10);

  for(const pop of g.pops){ pop.life -= dt; pop.y -= 26 * dt; }
  g.pops = g.pops.filter(pop => pop.life > 0);
}

// ── 렌더 ────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r){
  // (게임 캔버스 렌더 헬퍼)
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 이미지를 박스에 잘림 없이(cover) 그리기
function drawImageCover(ctx, img, x, y, w, h){
  const iw = img.naturalWidth || img.width || 1, ih = img.naturalHeight || img.height || 1;
  const s = Math.max(w / iw, h / ih), dw = iw * s, dh = ih * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}

function drawSky(ctx, W, H){
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#cfe6ff"); sky.addColorStop(.62, "#ecf4ff"); sky.addColorStop(1, "#fdeeda");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
}

function drawClouds(ctx, W, t){
  const shift = (t * 22) % (W + 140);
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for(let i = 0; i < 3; i++){
    const cx = ((i * (W / 2 + 90) - shift) % (W + 140) + W + 140) % (W + 140) - 70;
    const cy = 28 + i * 20;
    ctx.beginPath();
    ctx.arc(cx, cy, 14, 0, 7); ctx.arc(cx + 17, cy + 4, 18, 0, 7); ctx.arc(cx + 36, cy, 13, 0, 7);
    ctx.fill();
  }
}

// 🏰 왕국 성 배경(느린 패럴럭스)
function drawCastle(ctx, W, gY, scroll){
  const wallTop = gY - 58;
  ctx.fillStyle = "#9aa3c6"; ctx.fillRect(0, wallTop, W, gY - wallTop);
  ctx.fillStyle = "#8b95bd"; ctx.fillRect(0, wallTop, W, 7);
  // 성벽 톱니
  ctx.fillStyle = "#8b95bd";
  const mOff = scroll % 36;
  for(let x = -mOff; x < W + 36; x += 36) ctx.fillRect(x, wallTop - 11, 20, 12);
  // 탑
  const period = 210, off = scroll % period;
  for(let x = -off - period; x < W + period; x += period){
    const tx = x + 70, tw = 56, top = gY - 120;
    ctx.fillStyle = "#8d97bf"; ctx.fillRect(tx, top, tw, gY - top);
    ctx.fillStyle = "#7d87b2";
    for(let mx = tx; mx < tx + tw - 6; mx += 18) ctx.fillRect(mx, top - 11, 12, 12);
    ctx.fillStyle = "#7b6bd0"; // 지붕
    ctx.beginPath(); ctx.moveTo(tx - 7, top); ctx.lineTo(tx + tw / 2, top - 42); ctx.lineTo(tx + tw + 7, top); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#5a4a7a"; ctx.lineWidth = 2; // 깃대
    ctx.beginPath(); ctx.moveTo(tx + tw / 2, top - 42); ctx.lineTo(tx + tw / 2, top - 60); ctx.stroke();
    ctx.fillStyle = "#ff7bb0"; // 깃발
    ctx.beginPath(); ctx.moveTo(tx + tw / 2, top - 60); ctx.lineTo(tx + tw / 2 + 15, top - 55); ctx.lineTo(tx + tw / 2, top - 50); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#5b6699"; // 창문
    ctx.fillRect(tx + tw / 2 - 6, top + 22, 12, 22);
    ctx.beginPath(); ctx.arc(tx + tw / 2, top + 22, 6, Math.PI, 0); ctx.fill();
  }
}

function drawGround(ctx, W, H, gY, stripePhase){
  ctx.fillStyle = "#8ad08f"; ctx.fillRect(0, gY, W, H - gY);
  ctx.fillStyle = "#73c07a"; ctx.fillRect(0, gY, W, 6);
  ctx.fillStyle = "rgba(255,255,255,.25)";
  const stripe = stripePhase % 46;
  for(let x = -stripe; x < W; x += 46) ctx.fillRect(x, gY + 16, 22, 5);
}

// 바닥 구멍(낭떠러지) 그리기 — drawGround 다음에 호출해 땅을 파냄
function drawPits(ctx, pits, gY, H){
  for(const p of pits){
    const grd = ctx.createLinearGradient(0, gY, 0, H);
    grd.addColorStop(0, "#4a3a28"); grd.addColorStop(1, "#241a12");
    ctx.fillStyle = grd; ctx.fillRect(p.x, gY, p.w, H - gY);
    // 양옆 흙벽 + 풀 가장자리
    ctx.fillStyle = "#6b4f2e"; ctx.fillRect(p.x - 4, gY, 4, H - gY); ctx.fillRect(p.x + p.w, gY, 4, H - gY);
    ctx.fillStyle = "#5a8f4f"; ctx.fillRect(p.x - 4, gY, 4, 7); ctx.fillRect(p.x + p.w, gY, 4, 7);
  }
}

function drawHero(ctx, x, py, size){
  ctx.save();
  roundRect(ctx, x, py, size, size, 14); ctx.clip();
  if(GAME.heroReady && GAME.heroImg) drawImageCover(ctx, GAME.heroImg, x, py, size, size);
  else {
    ctx.fillStyle = "#fff0f7"; ctx.fillRect(x, py, size, size);
    ctx.fillStyle = "#000"; ctx.font = Math.round(size * 0.7) + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(GAME.heroEmoji, x + size / 2, py + size / 2 + 2);
  }
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = "#fff";
  roundRect(ctx, x, py, size, size, 14); ctx.stroke();
}

function drawKing(ctx, x, gY, size){
  ctx.font = size + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  ctx.fillText("🤴", x, gY + 2);
}

function drawCoin(ctx, c){
  ctx.save();
  if(c.big){ ctx.fillStyle = "rgba(255,210,60,.35)"; ctx.beginPath(); ctx.arc(c.x, c.y, c.r + 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = c.big ? "#ffce2e" : "#ffd23f";
  ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill();
  ctx.lineWidth = c.big ? 4 : 3; ctx.strokeStyle = c.big ? "#d98a00" : "#f0a500"; ctx.stroke();
  ctx.fillStyle = c.big ? "#9c5b00" : "#f0a500";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(c.r * (c.big ? 0.8 : 1.0)) + "px Jua, sans-serif";
  ctx.fillText(c.big ? "10" : "1", c.x, c.y + 1);
  ctx.restore();
}

function drawHeartIcon(ctx, cx, cy, r){
  ctx.save();
  // 부드러운 글로우
  ctx.fillStyle = "rgba(255,120,150,.3)"; ctx.beginPath(); ctx.arc(cx, cy, r + 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#ff5d7a"; ctx.strokeStyle = "#d83b5e"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx, cy + r * 0.85);
  ctx.bezierCurveTo(cx + r * 1.3, cy - r * 0.2, cx + r * 0.5, cy - r * 1.1, cx, cy - r * 0.35);
  ctx.bezierCurveTo(cx - r * 0.5, cy - r * 1.1, cx - r * 1.3, cy - r * 0.2, cx, cy + r * 0.85);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawPops(ctx, g){
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(const pop of g.pops){
    ctx.globalAlpha = Math.max(0, Math.min(1, pop.life * 2));
    ctx.fillStyle = pop.color; ctx.font = "bold 18px Jua, sans-serif";
    ctx.fillText(pop.text, pop.x, pop.y);
    ctx.globalAlpha = 1;
  }
}

// 갇힌 공주(해나 사진) — cx 중심, bottomY 바닥, w 가로폭
function drawCagedPrincess(ctx, cx, bottomY, w, barsBroken, t){
  const h = w * 1.15, x = cx - w / 2, y = bottomY - h;
  ctx.save();
  roundRect(ctx, x, y, w, h, 8); ctx.clip();
  if(GAME.princessReady && GAME.princessImg) drawImageCover(ctx, GAME.princessImg, x, y, w, h);
  else {
    ctx.fillStyle = "#ffe0ef"; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = "#000"; ctx.font = Math.round(w * 0.6) + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("👸", cx, y + h / 2);
  }
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = "#6b5a44"; roundRect(ctx, x, y, w, h, 8); ctx.stroke();
  if(!barsBroken){
    ctx.strokeStyle = "rgba(60,48,36,.92)"; ctx.lineWidth = Math.max(2, w * 0.05);
    for(let i = 1; i < 5; i++){ const bx = x + i * w / 5; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx, y + h); ctx.stroke(); }
    ctx.lineWidth = Math.max(3, w * 0.06); ctx.strokeStyle = "#5b4a36"; ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#caa53a"; ctx.beginPath(); ctx.arc(cx, y + h, Math.max(5, w * 0.1), 0, 7); ctx.fill();
  } else {
    ctx.font = Math.round(w * 0.45) + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText("👑", cx, y - 2);
  }
}

// 플레이 중 우측 상단의 '납치된 공주' 표시
function drawCapturedCorner(ctx, W, t){
  const w = 50, cageH = w * 1.15, cx = W - 36 + Math.sin(t * 7) * 1.5, bottomY = 96;
  ctx.font = "bold 12px Jua, sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#d23c6a";
  ctx.fillText(Math.floor(t * 2) % 2 ? "도와줘요! 🆘" : "공주가 갇혔어!", cx - w / 2 - 6, bottomY - cageH - 8);
  drawCagedPrincess(ctx, cx, bottomY, w, false, t);
}

function spawnSparks(x, y){
  for(let i = 0; i < 16; i++){
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 180;
    GAME.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
      life: 0.8 + Math.random() * 0.5, ch: ["✨","💖","⭐","🌟"][Math.floor(Math.random() * 4)] });
  }
}

function gameRender(){
  const ctx = GAME.ctx, W = GAME.W, H = GAME.H, gY = GAME.groundY, g = GAME;
  drawSky(ctx, W, H);
  drawClouds(ctx, W, g.elapsed);
  drawCastle(ctx, W, gY, g.elapsed * 60);
  drawGround(ctx, W, H, gY, g.elapsed * g.speed);
  drawPits(ctx, g.pits, gY, H);

  // 코인(작은 1코인 / 큰 10코인)
  for(const c of g.coins){ if(!c.taken) drawCoin(ctx, c); }
  // 보너스 하트
  for(const bz of g.boosts){ if(!bz.taken) drawHeartIcon(ctx, bz.x, bz.y, bz.r); }

  // 장애물 (선인장풍) — big은 더 크고 진한 색
  for(const o of g.obstacles){
    ctx.fillStyle = o.big ? "#2e9248" : "#3fae5a";
    roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(8, o.w / 2)); ctx.fill();
    if(o.h > 40){
      const armLen = Math.min(o.big ? 26 : 18, o.h * 0.3);
      const ay = o.y + o.h * 0.4;
      roundRect(ctx, o.x - 7, ay, 7, armLen, 4); ctx.fill();
      roundRect(ctx, o.x + o.w, ay + 6, 7, armLen, 4); ctx.fill();
    }
    ctx.fillStyle = o.big ? "#236e37" : "#2f9249"; ctx.fillRect(o.x + o.w * 0.3, o.y + 6, 3, o.h - 12);
  }

  // 납치된 공주(해나) — 우측 상단
  drawCapturedCorner(ctx, W, g.elapsed);

  // 그림자
  const p = g.player;
  const shY = gY - 4, sw = p.size * (0.5 + 0.4 * (1 - Math.min(1, (gY - p.size - p.y) / 130)));
  ctx.fillStyle = "rgba(60,90,70,.18)";
  ctx.beginPath(); ctx.ellipse(p.x + p.size / 2, shY, sw / 2, 6, 0, 0, 7); ctx.fill();

  // 플레이어 (무적 중 깜빡임)
  const blink = g.inv > 0 && Math.floor(g.elapsed * 14) % 2 === 0;
  if(!blink){
    const bob = p.onGround ? Math.abs(Math.sin(g.elapsed * 11)) * 3 : 0;
    drawHero(ctx, p.x, p.y - bob, p.size);
  }

  drawPops(ctx, g);
}

// ── 🏰 공주 구출 컷신(20초 후) ─────────────────────────────
function startRescue(){
  GAME.phase = "rescue"; GAME.rescueT = 0; GAME.sparks = []; GAME.pops = [];
  GAME.obstacles = []; GAME.coins = []; GAME.boosts = []; GAME.pits = [];
  setHud(false); showJumpBtn(false);
  GAME.player.vy = 0;
  GAME.rescue = {
    px: GAME.player.x, pTarget: Math.round(GAME.W * 0.33),
    kingX: GAME.W + 90, kingTarget: Math.round(GAME.W * 0.72),
    cageX: Math.round(GAME.W * 0.55), barsBroken: false,
  };
}

function updateRescue(dt){
  const g = GAME, r = GAME.rescue, p = g.player;
  r.px += (r.pTarget - r.px) * Math.min(1, dt * 4);
  r.kingX += (r.kingTarget - r.kingX) * Math.min(1, dt * 3);
  p.vy += GRAVITY * dt; p.y += p.vy * dt;
  const floor = g.groundY - p.size; if(p.y >= floor){ p.y = floor; p.vy = 0; }
  if(!r.barsBroken && g.rescueT > 1.6){
    r.barsBroken = true;
    spawnSparks(r.cageX, g.groundY - p.size);
    g.pops.push({ x: r.cageX, y: g.groundY - 120, life: 1.8, text: "공주 구출! 🎉", color: "#e0568a" });
  }
  for(const s of g.sparks){ s.vy += 520 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; }
  g.sparks = g.sparks.filter(s => s.life > 0);
  for(const pop of g.pops){ pop.life -= dt; pop.y -= 24 * dt; }
  g.pops = g.pops.filter(pp => pp.life > 0);
}

function renderRescue(){
  const ctx = GAME.ctx, W = GAME.W, H = GAME.H, gY = GAME.groundY, g = GAME, r = GAME.rescue;
  drawSky(ctx, W, H);
  drawClouds(ctx, W, g.elapsed);
  drawCastle(ctx, W, gY, g.elapsed * 60);
  drawGround(ctx, W, H, gY, g.elapsed * g.speed);

  const cageW = Math.min(120, Math.round(H * 0.32));
  drawCagedPrincess(ctx, r.cageX, gY, cageW, r.barsBroken, g.rescueT);
  drawKing(ctx, r.kingX, gY, Math.min(96, Math.round(g.player.size * 1.3)));
  drawHero(ctx, r.px, g.player.y, g.player.size);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for(const s of g.sparks){
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.6));
    ctx.font = "20px serif"; ctx.fillText(s.ch, s.x, s.y); ctx.globalAlpha = 1;
  }

  // 상단 배너
  const bw = Math.min(320, W - 20);
  ctx.fillStyle = "rgba(255,255,255,.88)"; roundRect(ctx, W / 2 - bw / 2, 12, bw, 44, 14); ctx.fill();
  ctx.fillStyle = "#e0568a"; ctx.font = "bold 19px Jua, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(r.barsBroken ? "👑 왕이 공주를 구했어요! 🎉" : "👑 왕이 달려옵니다...", W / 2, 34);

  drawPops(ctx, g);

  if(g.rescueT > 0.8){
    ctx.fillStyle = "rgba(90,74,102,.85)"; ctx.font = "14px Jua, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillText("탭 또는 스페이스로 계속 ▶", W / 2, H - 12);
  }
}

function goToScore(){
  if(GAME.phase !== "rescue") return;
  GAME.phase = "play";
  endRun(true);
}

// ── 종료 ────────────────────────────────────────────────────
function endRun(success){
  stopLoop();
  showJumpBtn(false);
  let bonus = 0;
  if(success){ bonus = 30 + GAME.hearts * 10; GAME.score += bonus; }
  updateHud();
  const lastName = (function(){ try{ return localStorage.getItem("hh_name") || ""; }catch(e){ return ""; } })();
  setHud(false);
  const heroName = lastTop ? lastTop.name : "용사";
  const ending = success ? `
    <div class="ending-scene">
      <div class="ending-cast">
        <div class="cast">
          <div class="cast-emoji cast-king">🤴</div>
          <div class="cast-label">👑 해나 아빠 왕</div>
        </div>
        <div class="cast">
          <img class="cast-img" src="/img/hn.jpg" alt="해나 공주"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cast-emoji',textContent:'👸'}))">
          <div class="cast-label">👸 해나 공주</div>
        </div>
      </div>
      <div class="ending-speech">"오, 용감한 <b>${esc(heroName)}</b>! 🎉<br><b>해나 공주</b>를 무사히 구해줘서 고맙네!" 👑✨</div>
    </div>` : "";
  const s = $g("gameScreen");
  s.classList.remove("hidden");
  s.innerHTML = `
    <h2 class="gs-title">${success ? "골인! 공주 구출 성공! 🎉" : "게임 끝! 🐾"}</h2>
    ${ending}
    ${success ? "" : heroImgTag("gs-hero")}
    <div class="gs-score">⭐ ${GAME.score}점</div>
    <p class="gs-sub">🪙 코인 ${GAME.coinCount}개 ${success ? "· 완주 보너스 +" + bonus + " 🏅" : "· 다음엔 더 멀리!"}</p>
    <div class="gs-row">
      <input id="nameInput" class="name-input" maxlength="12" placeholder="이름을 적어줘 ✏️" value="${esc(lastName)}">
    </div>
    <div class="gs-row">
      <button class="gs-btn" id="submitBtn" onclick="submitMyScore()">🏆 랭킹 등록</button>
      <button class="gs-btn ghost" onclick="beginRun()">🔄 다시 도전</button>
      <button class="gs-btn ghost" onclick="closeAdventure()">닫기</button>
    </div>
    <div id="boardMount" class="board-wrap"></div>`;
  renderBoardInto($g("boardMount"), null);
}

// ── 점수 등록 ───────────────────────────────────────────────
async function submitMyScore(){
  if(GAME.submitted) return;
  const input = $g("nameInput");
  const name = (input && input.value || "").trim() || "익명";
  try{ localStorage.setItem("hh_name", name); }catch(e){}
  GAME.submitted = true;
  const btn = $g("submitBtn");
  if(btn){ btn.disabled = true; btn.textContent = "등록 중..."; }
  const entry = { name, score: GAME.score, character: lastTop ? lastTop.name : "" };
  const res = await submitScore(entry);
  if(btn){ btn.textContent = res.rank ? res.rank + "위 등록! 🎉" : "등록 완료! 🎉"; }
  renderBoardInto($g("boardMount"), { name: entry.name, score: entry.score });
}

// ── 랭킹만 보기 화면 ────────────────────────────────────────
function showBoardOnly(){
  setHud(false);
  const s = $g("gameScreen");
  s.classList.remove("hidden");
  s.innerHTML = `
    <h2 class="gs-title">🏆 누적 랭킹</h2>
    <div id="boardMount" class="board-wrap"></div>
    <div class="gs-row">
      ${lastTop ? '<button class="gs-btn go" onclick="startAdventure()">🏃 모험 하러가기</button>' : ""}
      <button class="gs-btn ghost" onclick="closeAdventure()">닫기</button>
    </div>`;
  renderBoardInto($g("boardMount"), null);
}

/* ── 리더보드 API (실패 시 localStorage 폴백) ─────────────── */
const SCORES_KEY = "hh_scores_v1";
let boardIsLocal = false;

function localScores(){
  try{ const a = JSON.parse(localStorage.getItem(SCORES_KEY)); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function saveLocalScores(arr){
  try{ localStorage.setItem(SCORES_KEY, JSON.stringify(arr.slice(0, 100))); }catch(e){}
}

async function fetchScores(){
  try{
    const r = await fetch("/api/scores", { cache: "no-store" });
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d || !Array.isArray(d.scores)) throw 0;
    boardIsLocal = false;
    return d.scores;
  }catch(e){
    boardIsLocal = true;
    return localScores().slice(0, 50);
  }
}

async function submitScore(entry){
  try{
    const r = await fetch("/api/scores", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    });
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d || !d.ok) throw 0;
    boardIsLocal = false;
    return { rank: d.rank, scores: d.scores };
  }catch(e){
    boardIsLocal = true;
    const arr = localScores();
    const rec = { name: entry.name, score: entry.score, character: entry.character, ts: Date.now() };
    arr.push(rec);
    arr.sort((a, b) => b.score - a.score || a.ts - b.ts);
    const trimmed = arr.slice(0, 100);
    saveLocalScores(trimmed);
    const rank = trimmed.indexOf(rec) + 1;
    return { rank: rank || null, scores: trimmed.slice(0, 50) };
  }
}

async function renderBoardInto(mount, highlight){
  if(!mount) return;
  mount.innerHTML = `<p class="board-note">불러오는 중... ⏳</p>`;
  const scores = await fetchScores();
  mount.innerHTML = boardMarkup(scores, highlight);
}

function boardMarkup(scores, highlight){
  const note = boardIsLocal
    ? "⚠️ 지금은 이 기기에만 저장돼요 (랭킹 서버 미연결)"
    : "전 세계 친구들과 함께하는 누적 랭킹 ✨";
  if(!scores.length){
    return `<p class="board-note">${note}</p><div class="board-empty">아직 기록이 없어요. 1등이 되어보세요! 🥇</div>`;
  }
  let hlDone = false;
  const rows = scores.map((e, i) => {
    const rank = i + 1;
    let me = "";
    if(highlight && !hlDone && e.name === highlight.name && Number(e.score) === Number(highlight.score)){
      me = " me"; hlDone = true;
    }
    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
    const rcls = rank <= 3 ? " r" + rank : "";
    const char = e.character ? `<span class="board-char">${esc(e.character)}</span>` : "";
    return `<li class="${me.trim()}">
      <span class="board-rank${rcls}">${medal}</span>
      <span class="board-name">${esc(e.name)}</span>
      ${char}
      <span class="board-score">${Number(e.score) || 0}</span>
    </li>`;
  }).join("");
  return `<p class="board-title">TOP ${scores.length}</p><p class="board-note">${note}</p><ul class="board-list">${rows}</ul>`;
}
