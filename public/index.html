<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎀 내 캐릭터 친구 찾기 🎀</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap');

  .board-rank.r1 { color: #f5b301; } .board-rank.r2 { color: #9aa7b5; } .board-rank.r3 { color: #cd7f32; }
  .board-name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-char { font-size: .82rem; color: #a98fc0; flex: none; max-width: 96px;

  /* 👑 엔딩 연출(완주 시 왕이 공주를 구해줘 고마워하는 장면) */

  .cast-king { animation: bob 2s ease-in-out infinite; }
  .cast-img { width: 72px; height: 72px; border-radius: 16px; object-fit: cover;
    border: 3px solid #fff; box-shadow: 0 4px 10px rgba(180,120,160,.3); }

    position: relative; background: #fff; border: 2px solid #ffd86b; border-radius: 16px;

<body>
  <div class="title">🎀 <span class="name">이해나</span> · <span class="name">이해성</span> 캐릭터 찾기 🎀</div>
  <div class="subtitle">우리 해나·해성이를 위한 특별한 캐릭터 찾기 ✨</div>

  <div class="mascot-row">
    <div class="mascot" id="mascot">🐰</div>
    <div class="speech" id="speech">안녕! 7개만 골라주면 너에게 딱 맞는 캐릭터를 찾아줄게 💕</div>
  </div>

  <div class="card" id="app"></div>

  <!-- 보일듯말듯한 비밀의 알 → 이브이 -->
  <div class="egg" id="egg" onclick="showEevee()" title="?">🥚</div>

  <!-- 🎮 모험 게임 오버레이 -->
  <div class="game-overlay" id="gameOverlay" style="display:none">
    <div class="game-stage">
      <canvas id="gameCanvas"></canvas>
      <div class="game-hud" id="gameHud" style="display:none">
        <span class="hud-chip hud-time">⏱ <span id="hudTime">20</span>초</span>
        <span class="hud-chip">🪙 <span id="hudCoins">0</span></span>
        <span class="hud-chip">❤️ <span id="hudHearts">3</span></span>
        <span class="hud-chip">⭐ <span id="hudScore">0</span></span>
      </div>
      <div class="game-screen" id="gameScreen"></div>
    </div>
  </div>

<script>
let answers = {};
let step = 0;
let lastTop = null; // 마지막으로 추천된 캐릭터(모험 게임 주인공)
const MASCOTS = ["🐰","🤍","💜","🐶","🐱","🎀","⭐","🌈"];

// ── 캐릭터 데이터 로드 (한 번만 받아서 캐시) ──────────────
let CHARACTERS = null;
async function loadCharacters() {
  if (CHARACTERS) return CHARACTERS;
  const data = await (await fetch("characters.json")).json();
  CHARACTERS = data.characters;
  return CHARACTERS;
}

// ── 룰베이스 추천 점수 (서버 로직을 브라우저로 이식) ──────
const SYNONYMS = {
  "멋진":   ["스타일리시", "시크한", "멋진", "인기많은"],
  "강한":   ["강력한", "강한", "힘센", "액션", "배틀", "슈팅", "보스"],
  "무서운": ["무서운", "호러", "몬스터", "스릴", "퇴마사"],
  "웃긴":   ["웃긴", "엉뚱한", "장난꾸러기", "유머러스", "밈"],
  "똑똑한": ["똑똑한", "발명", "진지한", "리더십"],
  "신비한": ["신비한", "마법", "전설", "변신"],
  "활발한": ["활발한", "에너지", "빠른"],
  "귀여운": ["귀여운", "사랑", "사랑스러운", "다정한", "착한", "순수한"],
  "모험":   ["모험", "탐험", "생존", "배틀"],
  "변신":   ["변신", "로봇", "마법"],
  "수집":   ["수집", "진화"],
  "만들기": ["만들기", "건축", "발명"],
  "춤추기": ["춤추기", "음악", "노래"],
  "하양":   ["하양", "하얀색"],
};

function matchKeyword(c, value, cap) {
  if (!value || value === "any") return 0;
  let s = 0;
  if (c.keywords.includes(value)) s += 3;
  (SYNONYMS[value] || []).forEach((k) => {
    if (c.keywords.includes(k)) s += 1;
  });
  return Math.min(s, cap);
}

const KEYWORD_DIMS = [
  { key: "mood", cap: 4 },
  { key: "color", cap: 3 },
  { key: "activity", cap: 4 },
  { key: "animal", cap: 4 },
  { key: "personality", cap: 4 },
];

function scoreCharacter(c, a) {
  const parts = {};
  if (a.gender) {
    if (c.target_gender === a.gender) parts.gender = 6;
    else if (c.target_gender === "공통") parts.gender = 2;
    else parts.gender = -5;
  }
  if (a.type && a.type !== "any") {
    const inCat = c.category.includes(a.type);
    const inSub = (c.sub_category || "").includes(a.type);
    if (inCat || inSub) parts.type = 6 + (inSub ? 2 : 0);
    else parts.type = -1;
  }
  if (c.target_age === "고학년") parts.age = -2;
  if (a.who === "hana" || a.who === "haesung") {
    if (["유치원", "저학년", "전학년"].includes(c.target_age)) parts.who = 1;
  }
  for (const { key, cap } of KEYWORD_DIMS) {
    const v = matchKeyword(c, a[key], cap);
    if (v) parts[key] = v;
  }
  const total = Object.values(parts).reduce((sum, v) => sum + v, 0);
  return { total, parts };
}

function pickRunners(ranked, top, count) {
  const runners = [];
  const usedSubs = new Set([top.sub_category]);
  for (const c of ranked) {
    if (runners.length >= count) break;
    if (c.id === top.id) continue;
    if (usedSubs.has(c.sub_category)) continue;
    runners.push(c);
    usedSubs.add(c.sub_category);
  }
  for (const c of ranked) {
    if (runners.length >= count) break;
    if (c.id === top.id || runners.includes(c)) continue;
    runners.push(c);
  }
  return runners;
}

// 추천 계산: answers → { top, runners } (서버 /api/recommend 대체)
async function recommend(a) {
  const ranked = (await loadCharacters())
    .map((c) => {
      const { total, parts } = scoreCharacter(c, a);
      return { ...c, score: total, score_parts: parts };
    })
    .sort((x, y) => y.score - x.score);
  const top = ranked[0];
  return { top, runners: pickRunners(ranked, top, 2) };
}

// 첫 페이지: 너는 누구야? (4지선다)
const WHO_OPTIONS = [
  { emoji:"👧", label:"나는 이해나야!",       value:"hana",    img:"/img/hn.jpg" },
  { emoji:"👦", label:"나는 이해성이야!",     value:"haesung", img:"/img/hs.jpg" },
  { emoji:"🧒", label:"해나·해성 친구예요",   value:"friend" },
  { emoji:"👨‍👩‍👧‍👦", label:"해나·해성 가족이에요", value:"family" },
];
const GREET = {
  hana:    "이해나 공주님 안녕! 🎀 딱 맞는 캐릭터 찾아줄게~",
  haesung: "이해성 왕자님 안녕! ⭐ 멋진 캐릭터 찾아줄게~",
  friend:  "친구야 반가워! 💕 너에게 맞는 캐릭터 찾아줄게~",

  const q = QUESTIONS[step];

  say(step === 0 && answers.who ? `${GREET[answers.who]}` : q.talk);
  let html = `<div class="progress-dots">`;
  for (let i=0;i<QUESTIONS.length;i++){
    const cls = i===step ? "on" : (i<step ? "done" : "");
    html += `<div class="dot ${cls}"></div>`;
  }
  html += `</div><div class="question">${q.text}</div><div class="options">`;
  q.options.forEach((o,i)=>{
    html += `<button class="opt c${(i%4)+1}" onclick="choose('${q.key}','${o.value}')">
      <span class="emoji">${o.emoji}</span>${o.label}</button>`;
  });
  html += `</div>`;
  html += `<button class="back-btn" onclick="back()">← 뒤로</button>`;
  app.innerHTML = html;
}

/* ════════════════════════════════════════════════════════════
   🎮 모험 게임 (20초 횡스크롤 러너) + 🏆 누적 랭킹
   ════════════════════════════════════════════════════════════ */

const GAME = {
  canvas:null, ctx:null, W:0, H:0, dpr:1,
  raf:0, running:false, last:0, elapsed:0,
  groundY:0, speed:0,
  player:null, obstacles:[], coins:[], pops:[],
  spawnObs:0, spawnCoin:0,
  coinCount:0, score:0, hearts:3, inv:0,
  heroUrl:"", heroEmoji:"⭐", heroImg:null, heroReady:false,
  submitted:false,
};
const DUR = 20;          // 게임 길이(초)
const GRAVITY = 2300;
const JUMP_V = -780;
const MAX_JUMPS = 2;

function $g(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ── 진입점: 결과 화면의 모험 버튼 ───────────────────────────
function startAdventure(){
  if(!lastTop){ return; }

  if(GAME.heroUrl){
    const im = new Image();
    im.onload = ()=>{ GAME.heroReady = true; };
    im.onerror = ()=>{ GAME.heroReady = false; };

// ── 캔버스 크기 설정 ────────────────────────────────────────
function sizeCanvas(){
  const stage = GAME.canvas.parentElement;
  const cssW = stage.clientWidth || 360;
  const cssH = Math.max(240, Math.min(430, Math.round(cssW * 0.62)));
  GAME.dpr = window.devicePixelRatio || 1;
  GAME.canvas.style.height = cssH + "px";
  GAME.canvas.width = Math.round(cssW * GAME.dpr);
  GAME.canvas.height = Math.round(cssH * GAME.dpr);
  GAME.ctx.setTransform(GAME.dpr, 0, 0, GAME.dpr, 0, 0);
  GAME.W = cssW; GAME.H = cssH;
  GAME.groundY = cssH - 46;
}

// ── 게임 시작 ───────────────────────────────────────────────
function beginRun(){
  GAME.canvas = $g("gameCanvas");
  GAME.ctx = GAME.canvas.getContext("2d");
  sizeCanvas();

  const size = Math.max(46, Math.min(74, Math.round(GAME.H * 0.2)));
  GAME.player = {
    x: Math.max(54, Math.round(GAME.W * 0.16)),
    size, y: GAME.groundY - size, vy: 0, jumps: 0, onGround: true,
  };
  GAME.obstacles = []; GAME.coins = []; GAME.pops = [];
  GAME.spawnObs = 0.8; GAME.spawnCoin = 0.5;
  GAME.coinCount = 0; GAME.score = 0; GAME.hearts = 3; GAME.inv = 0;
  GAME.elapsed = 0; GAME.speed = 250; GAME.submitted = false;

  $g("gameScreen").classList.add("hidden");
  setHud(true); updateHud();

  bindInput(true);
  GAME.running = true;
  GAME.last = 0;
  GAME.raf = requestAnimationFrame(loop);
}

function stopLoop(){
  GAME.running = false;
  if(GAME.raf) cancelAnimationFrame(GAME.raf);
  GAME.raf = 0;
  bindInput(false);
}

// ── 입력(점프) ──────────────────────────────────────────────
function doJump(){
  const p = GAME.player;
  if(!p || !GAME.running) return;
  if(p.jumps < MAX_JUMPS){ p.vy = JUMP_V; p.jumps++; p.onGround = false; }
}
function onKey(e){
  if(e.code === "Space" || e.code === "ArrowUp" || e.key === " "){ e.preventDefault(); doJump(); }
}
function onPointer(e){ e.preventDefault(); doJump(); }
function bindInput(on){
  const c = GAME.canvas;
  if(on){
    window.addEventListener("keydown", onKey);
    if(c) c.addEventListener("pointerdown", onPointer);
  } else {
    window.removeEventListener("keydown", onKey);
    if(c) c.removeEventListener("pointerdown", onPointer);
  }
}

// ── 스폰 ────────────────────────────────────────────────────
function spawnObstacle(){
  const h = 28 + Math.floor(Math.random() * 38);   // 28~66
  const w = 22 + Math.floor(Math.random() * 18);
  GAME.obstacles.push({ x: GAME.W + 30, w, h, y: GAME.groundY - h });
}
function spawnCoins(){
  // 1개 또는 3개 아치형
  const cluster = Math.random() < 0.5 ? 3 : 1;
  const baseY = GAME.groundY - (36 + Math.floor(Math.random() * 110));
  for(let i = 0; i < cluster; i++){
    const arc = cluster === 3 ? -Math.sin((i / 2) * Math.PI) * 34 : 0;
    GAME.coins.push({ x: GAME.W + 30 + i * 34, y: baseY + arc, r: 13, taken: false });
  }
}

// ── 메인 루프 ───────────────────────────────────────────────
function loop(t){
  if(!GAME.running) return;
  if(!GAME.last) GAME.last = t;
  let dt = (t - GAME.last) / 1000;
  GAME.last = t;
  if(dt > 0.05) dt = 0.05;        // 탭 전환 후 점프 방지

  GAME.elapsed += dt;
  GAME.speed = 250 + Math.min(GAME.elapsed, DUR) / DUR * 175;
  update(dt);
  gameRender();
  updateHud();

  if(GAME.elapsed >= DUR){ endRun(true); return; }
  GAME.raf = requestAnimationFrame(loop);
}

function update(dt){
  const p = GAME.player, g = GAME;
  // 물리
  p.vy += GRAVITY * dt;
  p.y += p.vy * dt;
  const floorTop = g.groundY - p.size;
  if(p.y >= floorTop){ p.y = floorTop; p.vy = 0; p.jumps = 0; p.onGround = true; }
  else p.onGround = false;
  if(g.inv > 0) g.inv -= dt;

  // 스폰 타이머
  g.spawnObs -= dt;
  if(g.spawnObs <= 0){
    spawnObstacle();
    g.spawnObs = Math.max(0.7, 1.45 - g.elapsed * 0.03) + Math.random() * 0.5;
  }
  g.spawnCoin -= dt;
  if(g.spawnCoin <= 0){ spawnCoins(); g.spawnCoin = 0.7 + Math.random() * 0.7; }

  // 이동 + 충돌
  const pad = p.size * 0.16;
  const pb = { x: p.x + pad, y: p.y + pad, w: p.size - pad * 2, h: p.size - pad * 2 };

  for(const o of g.obstacles){
    o.x -= g.speed * dt;
    if(g.inv <= 0 &&
       pb.x < o.x + o.w && pb.x + pb.w > o.x &&
       pb.y < o.y + o.h && pb.y + pb.h > o.y){
      g.hearts--; g.inv = 1.0; p.vy = -340;
      g.pops.push({ x: p.x + p.size / 2, y: p.y, life: 0.7, text: "-❤️", color: "#e74c6f" });
      if(g.hearts <= 0){ gameRender(); endRun(false); return; }
    }
  }
  g.obstacles = g.obstacles.filter(o => o.x + o.w > -10);

  const pcx = p.x + p.size / 2, pcy = p.y + p.size / 2, pr = p.size * 0.42;
  for(const c of g.coins){
    c.x -= g.speed * dt;
    if(!c.taken){
      const dx = c.x - pcx, dy = c.y - pcy;
      if(dx * dx + dy * dy < (pr + c.r) * (pr + c.r)){
        c.taken = true; g.coinCount++; g.score += 10;
        g.pops.push({ x: c.x, y: c.y, life: 0.6, text: "+10", color: "#f5a201" });
      }
    }
  }
  g.coins = g.coins.filter(c => !c.taken && c.x + c.r > -10);

  for(const pop of g.pops){ pop.life -= dt; pop.y -= 26 * dt; }
  g.pops = g.pops.filter(pop => pop.life > 0);
}

// ── 렌더 ────────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r){
  // (게임 캔버스 렌더 헬퍼)
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function gameRender(){
  const ctx = GAME.ctx, W = GAME.W, H = GAME.H, gY = GAME.groundY, g = GAME;
  // 하늘
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#bfe6ff"); sky.addColorStop(1, "#eaf7ff");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // 구름 (느린 패럴럭스)
  const cloudShift = (g.elapsed * 22) % (W + 120);
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for(let i = 0; i < 3; i++){
    const cx = ((i * (W / 2 + 80) - cloudShift) % (W + 120) + W + 120) % (W + 120) - 60;
    const cy = 34 + i * 24;
    ctx.beginPath();
    ctx.arc(cx, cy, 16, 0, 7); ctx.arc(cx + 18, cy + 4, 20, 0, 7); ctx.arc(cx + 40, cy, 15, 0, 7);
    ctx.fill();
  }
  // 언덕
  const hillShift = (g.elapsed * g.speed * 0.25) % 220;
  ctx.fillStyle = "#bfe9c8";
  for(let i = -1; i < W / 220 + 1; i++){
    const hx = i * 220 - hillShift;
    ctx.beginPath(); ctx.arc(hx + 110, gY + 20, 120, Math.PI, 0); ctx.fill();
  }

  // 땅
  ctx.fillStyle = "#8ad08f"; ctx.fillRect(0, gY, W, H - gY);
  ctx.fillStyle = "#73c07a"; ctx.fillRect(0, gY, W, 6);
  // 땅 줄무늬(빠른 패럴럭스)
  ctx.fillStyle = "rgba(255,255,255,.25)";
  const stripe = (g.elapsed * g.speed) % 46;
  for(let x = -stripe; x < W; x += 46) ctx.fillRect(x, gY + 16, 22, 5);

  // 코인
  for(const c of g.coins){
    if(c.taken) continue;
    ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#f0a500"; ctx.stroke();
    ctx.fillStyle = "#f0a500"; ctx.font = "bold " + Math.round(c.r) + "px Jua, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("★", c.x, c.y + 1);
  }

  // 장애물 (선인장풍)
  for(const o of g.obstacles){
    ctx.fillStyle = "#3fae5a";
    roundRect(ctx, o.x, o.y, o.w, o.h, Math.min(8, o.w / 2)); ctx.fill();
    // 팔
    if(o.h > 40){
      const ay = o.y + o.h * 0.4;
      roundRect(ctx, o.x - 7, ay, 7, Math.min(18, o.h * 0.3), 4); ctx.fill();
      roundRect(ctx, o.x + o.w, ay + 6, 7, Math.min(18, o.h * 0.3), 4); ctx.fill();
    }
    ctx.fillStyle = "#2f9249"; ctx.fillRect(o.x + o.w * 0.3, o.y + 6, 3, o.h - 12);
  }

  // 그림자
  const p = g.player;
  const shY = gY - 4, sw = p.size * (0.5 + 0.4 * (1 - Math.min(1, (gY - p.size - p.y) / 130)));
  ctx.fillStyle = "rgba(60,90,70,.18)";
  ctx.beginPath(); ctx.ellipse(p.x + p.size / 2, shY, sw / 2, 6, 0, 0, 7); ctx.fill();

  // 플레이어 (무적 중 깜빡임)
  const blink = g.inv > 0 && Math.floor(g.elapsed * 14) % 2 === 0;
  if(!blink){
    const bob = p.onGround ? Math.abs(Math.sin(g.elapsed * 11)) * 3 : 0;
    const py = p.y - bob;
    ctx.save();
    roundRect(ctx, p.x, py, p.size, p.size, 14); ctx.clip();
    if(GAME.heroReady && GAME.heroImg){
      ctx.drawImage(GAME.heroImg, p.x, py, p.size, p.size);
    } else {
      ctx.fillStyle = "#fff0f7"; ctx.fillRect(p.x, py, p.size, p.size);
      ctx.fillStyle = "#000"; ctx.font = Math.round(p.size * 0.7) + "px serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(GAME.heroEmoji, p.x + p.size / 2, py + p.size / 2 + 2);
    }
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = "#fff";
    roundRect(ctx, p.x, py, p.size, p.size, 14); ctx.stroke();
  }

  // 점수 팝업
  for(const pop of g.pops){
    ctx.globalAlpha = Math.max(0, Math.min(1, pop.life * 2));
    ctx.fillStyle = pop.color; ctx.font = "bold 18px Jua, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(pop.text, pop.x, pop.y);
    ctx.globalAlpha = 1;
  }
}

// ── 종료 ────────────────────────────────────────────────────
function endRun(success){
  stopLoop();
  let bonus = 0;
  if(success){ bonus = 100 + GAME.hearts * 30; GAME.score += bonus; }
  updateHud();
  const lastName = (function(){ try{ return localStorage.getItem("hh_name") || ""; }catch(e){ return ""; } })();
  setHud(false);
  const heroName = lastTop ? lastTop.name : "용사";
  const ending = success ? `
    <div class="ending-scene">
      <div class="ending-cast">
        <div class="cast">
          <div class="cast-emoji cast-king">🤴</div>
          <div class="cast-label">👑 해나 아빠 왕</div>
        </div>
        <div class="cast">
          <img class="cast-img" src="/img/hn.jpg" alt="해나 공주"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'cast-emoji',textContent:'👸'}))">
          <div class="cast-label">👸 해나 공주</div>
        </div>
      </div>
      <div class="ending-speech">"오, 용감한 <b>${esc(heroName)}</b>! 🎉<br><b>해나 공주</b>를 무사히 구해줘서 고맙네!" 👑✨</div>
    </div>` : "";
  const s = $g("gameScreen");
  s.classList.remove("hidden");
  s.innerHTML = `
    <h2 class="gs-title">${success ? "골인! 공주 구출 성공! 🎉" : "게임 끝! 🐾"}</h2>
    ${ending}
    ${success ? "" : heroImgTag("gs-hero")}
    <div class="gs-score">⭐ ${GAME.score}점</div>
    <p class="gs-sub">🪙 코인 ${GAME.coinCount}개 ${success ? "· 완주 보너스 +" + bonus + " 🏅" : "· 다음엔 더 멀리!"}</p>
    <div class="gs-row">
      <input id="nameInput" class="name-input" maxlength="12" placeholder="이름을 적어줘 ✏️" value="${esc(lastName)}">
    </div>
    <div class="gs-row">
      <button class="gs-btn" id="submitBtn" onclick="submitMyScore()">🏆 랭킹 등록</button>
      <button class="gs-btn ghost" onclick="beginRun()">🔄 다시 도전</button>
      <button class="gs-btn ghost" onclick="closeAdventure()">닫기</button>
    </div>
    <div id="boardMount" class="board-wrap"></div>`;
  renderBoardInto($g("boardMount"), null);
}

// ── 점수 등록 ───────────────────────────────────────────────
async function submitMyScore(){
  if(GAME.submitted) return;
  const input = $g("nameInput");
  const name = (input && input.value || "").trim() || "익명";
  try{ localStorage.setItem("hh_name", name); }catch(e){}
  GAME.submitted = true;
  const btn = $g("submitBtn");
  if(btn){ btn.disabled = true; btn.textContent = "등록 중..."; }
  const entry = { name, score: GAME.score, character: lastTop ? lastTop.name : "" };
  const res = await submitScore(entry);
  if(btn){ btn.textContent = res.rank ? res.rank + "위 등록! 🎉" : "등록 완료! 🎉"; }
  renderBoardInto($g("boardMount"), { name: entry.name, score: entry.score });
}

// ── 랭킹만 보기 화면 ────────────────────────────────────────
function showBoardOnly(){
  setHud(false);
  const s = $g("gameScreen");
  s.classList.remove("hidden");
  s.innerHTML = `
    <h2 class="gs-title">🏆 누적 랭킹</h2>
    <div id="boardMount" class="board-wrap"></div>
    <div class="gs-row">
      ${lastTop ? '<button class="gs-btn go" onclick="startAdventure()">🏃 모험 하러가기</button>' : ""}
      <button class="gs-btn ghost" onclick="closeAdventure()">닫기</button>
    </div>`;
  renderBoardInto($g("boardMount"), null);
}

/* ── 리더보드 API (실패 시 localStorage 폴백) ─────────────── */
const SCORES_KEY = "hh_scores_v1";
let boardIsLocal = false;

function localScores(){
  try{ const a = JSON.parse(localStorage.getItem(SCORES_KEY)); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function saveLocalScores(arr){
  try{ localStorage.setItem(SCORES_KEY, JSON.stringify(arr.slice(0, 100))); }catch(e){}
}

async function fetchScores(){
  try{
    const r = await fetch("/api/scores", { cache: "no-store" });
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d || !Array.isArray(d.scores)) throw 0;
    boardIsLocal = false;
    return d.scores;
  }catch(e){
    boardIsLocal = true;
    return localScores().slice(0, 50);
  }
}

async function submitScore(entry){
  try{
    const r = await fetch("/api/scores", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    });
    if(!r.ok) throw 0;
    const d = await r.json();
    if(!d || !d.ok) throw 0;
    boardIsLocal = false;
    return { rank: d.rank, scores: d.scores };
  }catch(e){
    boardIsLocal = true;
    const arr = localScores();
    const rec = { name: entry.name, score: entry.score, character: entry.character, ts: Date.now() };
    arr.push(rec);
    arr.sort((a, b) => b.score - a.score || a.ts - b.ts);
    const trimmed = arr.slice(0, 100);
    saveLocalScores(trimmed);
    const rank = trimmed.indexOf(rec) + 1;
    return { rank: rank || null, scores: trimmed.slice(0, 50) };
  }
}

async function renderBoardInto(mount, highlight){
  if(!mount) return;
  mount.innerHTML = `<p class="board-note">불러오는 중... ⏳</p>`;
  const scores = await fetchScores();
  mount.innerHTML = boardMarkup(scores, highlight);
}

function boardMarkup(scores, highlight){
  const note = boardIsLocal
    ? "⚠️ 지금은 이 기기에만 저장돼요 (랭킹 서버 미연결)"
    : "전 세계 친구들과 함께하는 누적 랭킹 ✨";
  if(!scores.length){
    return `<p class="board-note">${note}</p><div class="board-empty">아직 기록이 없어요. 1등이 되어보세요! 🥇</div>`;
  }
  let hlDone = false;
  const rows = scores.map((e, i) => {
    const rank = i + 1;
    let me = "";
    if(highlight && !hlDone && e.name === highlight.name && Number(e.score) === Number(highlight.score)){
      me = " me"; hlDone = true;
    }
    const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
    const rcls = rank <= 3 ? " r" + rank : "";
    const char = e.character ? `<span class="board-char">${esc(e.character)}</span>` : "";
    return `<li class="${me.trim()}">
      <span class="board-rank${rcls}">${medal}</span>
      <span class="board-name">${esc(e.name)}</span>
      ${char}
      <span class="board-score">${Number(e.score) || 0}</span>
    </li>`;
  }).join("");
  return `<p class="board-title">TOP ${scores.length}</p><p class="board-note">${note}</p><ul class="board-list">${rows}</ul>`;
}
